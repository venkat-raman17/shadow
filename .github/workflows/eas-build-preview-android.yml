name: EAS Preview Build - Android

on:
  workflow_dispatch:

jobs:
  build-android:
    name: EAS Preview Build - Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        run: eas build --platform android --profile preview --non-interactive

      - name: Build status
        if: always()
        run: |
          echo "✅ Android preview build submitted to EAS"
          echo ""
          echo "📱 Check build status at:"
          echo "https://expo.dev/builds"
          echo ""
          echo "Download APK from build details when ready"
