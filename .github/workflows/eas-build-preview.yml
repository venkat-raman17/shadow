name: EAS Preview Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: EAS Preview Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        run: eas build --platform android --profile preview --non-interactive

      - name: Build iOS for TestFlight
        run: eas build --platform ios --profile preview --non-interactive

      - name: Build status
        if: always()
        run: |
          echo "✅ Preview builds submitted to EAS"
          echo ""
          echo "📱 Check build status at:"
          echo "https://expo.dev/builds"
          echo ""
          echo "Android APK: Download from build details"
          echo "iOS: Will appear in TestFlight after processing"
